# Render Blueprint Specification for VoiceLedger
# Docs: https://render.com/docs/blueprint-spec

version: "1"

services:
  # ── 1. VoiceLedger Web Service (FastAPI + WebSockets + Webhook Handler) ──
  - type: web
    name: voiceledger-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: feature/full-voiceledger-integration
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: voiceledger-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: voiceledger-redis
          property: connectionString
      - key: RUN_WORKER
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SOUNDBOX_SIGNING_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  # ── 2. Render Managed Key-Value Store (Redis-Compatible Pub/Sub & Caching) ──
  - type: keyvalue
    name: voiceledger-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys_lru
    ipAllowList: [] # Allow internal connections within the Render private network

databases:
  # ── 3. Managed PostgreSQL Ledger Database ──
  - name: voiceledger-db
    databaseName: voiceledger
    user: voiceledger_user
    plan: free
    region: oregon
