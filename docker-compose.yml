services:

  # ==========================================================
  # API
  # ==========================================================

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: voiceledger-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      # Docker service-to-service database hostname
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/voiceledger

      # Docker Redis hostname
      REDIS_URL: redis://redis:6379/0

      # API container does not launch another worker
      RUN_WORKER: "false"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    restart: unless-stopped


  # ==========================================================
  # Transactional Outbox Worker
  # ==========================================================

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: voiceledger-worker

    command:
      - python
      - -m
      - backend.app.worker

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/voiceledger
      REDIS_URL: redis://redis:6379/0

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    restart: unless-stopped


  # ==========================================================
  # PostgreSQL
  # ==========================================================

  postgres:
    image: postgres:16-alpine

    container_name: voiceledger-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voiceledger

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d voiceledger"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  # ==========================================================
  # Redis
  # ==========================================================

  redis:
    image: redis:7-alpine

    container_name: voiceledger-redis

    ports:
      - "6379:6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped


# ============================================================
# Persistent Volumes
# ============================================================

volumes:
  postgres_data: