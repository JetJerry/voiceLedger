[project]
name = "razorpay"
version = "0.1.0"
description = "VoiceLedger: AI Voice-First Payment Collection & Revenue Recovery Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "edge-tts>=7.2.8",
    "fastapi>=0.141.1",
    "faster-whisper>=1.1.0",
    "google-genai>=2.20.0",
    "gtts>=2.5.4",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mcp>=2.1.1",
    "nest-asyncio>=1.6.0",
    "openai>=3.6.0",
    "groq>=0.18.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "scipy>=1.14.0",
    "soundfile>=0.12.0",
    "sqlalchemy>=2.0.52",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "uvicorn[standard]>=0.52.4",
    "langgraph>=1.2.11",
    "langchain-core>=1.6.1",
    "langchain-groq>=1.1.3",
    "langchain-google-genai>=4.3.7",
    "langchain-openai>=1.6.0",
    "langsmith>=0.11.2",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "psycopg[binary]>=3.2.0",
    "argon2-cffi>=25.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
