[project]
name = "razorpay"
version = "0.1.0"
description = "VoiceLedger: AI Voice-First Payment Collection & Revenue Recovery Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "google-genai>=2.20.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
